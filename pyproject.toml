[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundlens"
version = "0.1.0"
description = "Agentic SEC filing intelligence: structured financial SQL plus hybrid retrieval"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3", "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3", "psycopg2-binary>=2.9,<3", "pgvector>=0.3,<1",
    "sqlglot>=25,<30", "numpy>=1.24,<3", "pandas>=2,<3",
    "groq>=0.11", "instructor>=1.5", "tenacity>=8,<10",
    "langgraph>=0.2", "rank-bm25>=0.2", "sentence-transformers>=3",
    "boto3>=1.34", "neo4j>=5", "tiktoken>=0.7", "streamlit>=1.37",
    "PyMuPDF>=1.24", "Pillow>=10", "python-dotenv>=1",
]

[project.optional-dependencies]
ingestion = ["docling>=2", "pdf2image>=1.17", "pypdf>=4", "camelot-py[cv]>=0.11", "tqdm>=4.66"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
