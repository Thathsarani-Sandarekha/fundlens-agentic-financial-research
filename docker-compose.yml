services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fundlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fundlens
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10_init.sql:ro
      - ./docker/postgres/schema.sql:/docker-entrypoint-initdb.d/20_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundlens -d fundlens"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports: ["127.0.0.1:7475:7474", "127.0.0.1:7688:7687"]
    volumes: ["neo4j_data:/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
volumes:
  postgres_data:
  neo4j_data:
  minio_data:
